# Build the image from a local Web App zip instead of downloading the release,
# e.g. when GitHub is unreachable. WEB_APP_ZIP_DIR is the folder that holds
# localrock-web.zip; keep WEB_APP_VERSION and WEB_APP_SHA256 in compose.yaml
# matching that zip, or the checksum check fails the build.
# WEB_APP_ZIP_DIR=/path/to/folder docker compose -f compose.yaml -f compose.web-app-zip.yaml build
services:
  roborock-local-server:
    build:
      additional_contexts:
        web_app_zip: ${WEB_APP_ZIP_DIR:?set WEB_APP_ZIP_DIR to the folder holding localrock-web.zip}
